<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Playlist | MusicHub</title>
    
    <!-- Google Fonts & Material Symbols -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    
    <!-- Tailwind CSS with Stitch Design Tokens -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#53e076",
                        "primary-container": "#1db954",
                        "on-primary": "#003914",
                        "on-primary-container": "#004118",
                        "secondary": "#3de96f",
                        "background": "#131313",
                        "surface": "#131313",
                        "surface-container": "#201f1f",
                        "surface-container-high": "#2a2a2a",
                        "surface-container-highest": "#353534",
                        "on-surface": "#e5e2e1",
                        "on-surface-variant": "#bccbb9"
                    }
                }
            }
        };
    </script>
    <link rel="stylesheet" th:href="@{/style.css}">
    <style>
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 16px); }
    </style>
</head>
<body class="stitch-theme bg-background text-on-surface antialiased min-h-screen">

    <!-- Top Navigation Fragment -->
    <div th:with="activePage='playlists'">
        <div th:replace="~{navbar :: navbar}"></div>
    </div>

    <!-- Main Content Container -->
    <main class="w-full min-h-screen pt-4 pb-28 px-4 sm:px-6 md:px-8 max-w-xl mx-auto flex flex-col space-y-6">

        <!-- Top Breadcrumb -->
        <div class="flex items-center justify-between text-xs text-on-surface-variant">
            <a th:href="@{/playlists}" class="inline-flex items-center gap-1.5 hover:text-primary transition-colors">
                <span class="material-symbols-outlined text-[18px]">arrow_back</span>
                <span>Back to Playlists</span>
            </a>
            <span class="px-2.5 py-1 rounded-full bg-surface-container-high text-on-surface-variant font-medium">
                Curation
            </span>
        </div>

        <!-- Form Card Container -->
        <div class="rounded-2xl bg-surface-container p-6 sm:p-8 shadow-2xl border border-white/10 relative overflow-hidden text-left">
            <div class="absolute -top-12 -right-12 w-48 h-48 bg-primary/10 rounded-full blur-3xl pointer-events-none"></div>

            <div class="relative z-10 space-y-6">
                <!-- Header -->
                <div class="border-b border-white/5 pb-4">
                    <div class="flex items-center gap-3">
                        <div class="w-12 h-12 rounded-2xl bg-primary-container text-on-primary-container flex items-center justify-center shadow-[0_0_20px_rgba(29,185,84,0.35)] flex-shrink-0">
                            <span class="material-symbols-outlined text-[28px]">playlist_add</span>
                        </div>
                        <div>
                            <h1 class="text-2xl font-extrabold text-white tracking-tight">Create Playlist</h1>
                            <p class="text-xs text-on-surface-variant mt-0.5">Start a fresh mix or mood collection in your library.</p>
                        </div>
                    </div>
                </div>

                <!-- Form -->
                <form th:action="@{/playlist/save}" th:object="${playlist}" method="post" class="space-y-5">
                    <div>
                        <label class="block text-xs uppercase tracking-wider text-on-surface-variant font-semibold mb-2">
                            Playlist Name <span class="text-primary">*</span>
                        </label>
                        <div class="relative flex items-center">
                            <span class="material-symbols-outlined absolute left-3.5 text-on-surface-variant pointer-events-none text-[20px]">queue_music</span>
                            <input type="text"
                                   th:field="*{name}"
                                   placeholder="e.g. Late Night Vibes, Road Trip 2026..."
                                   required
                                   class="w-full h-12 pl-11 pr-4 bg-surface-container-high text-white text-sm rounded-xl border border-white/10 focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-all placeholder:text-on-surface-variant/40" />
                        </div>
                    </div>

                    <!-- Quick Suggestions Chips -->
                    <div>
                        <span class="block text-[11px] text-on-surface-variant mb-2">Popular ideas:</span>
                        <div class="flex flex-wrap gap-1.5">
                            <button type="button" onclick="document.getElementById('name').value='Chill & Lo-Fi'" class="px-2.5 py-1 rounded-full bg-surface-container-high hover:bg-surface-container-highest text-xs text-on-surface-variant hover:text-white transition-colors border border-white/5">
                                Chill & Lo-Fi
                            </button>
                            <button type="button" onclick="document.getElementById('name').value='Gym Motivation'" class="px-2.5 py-1 rounded-full bg-surface-container-high hover:bg-surface-container-highest text-xs text-on-surface-variant hover:text-white transition-colors border border-white/5">
                                Gym Motivation
                            </button>
                            <button type="button" onclick="document.getElementById('name').value='Acoustic Mornings'" class="px-2.5 py-1 rounded-full bg-surface-container-high hover:bg-surface-container-highest text-xs text-on-surface-variant hover:text-white transition-colors border border-white/5">
                                Acoustic Mornings
                            </button>
                        </div>
                    </div>

                    <!-- Action Controls -->
                    <div class="flex items-center justify-end gap-3 pt-3 border-t border-white/5">
                        <a th:href="@{/playlists}"
                           class="px-5 py-2.5 rounded-full bg-surface-container-high hover:bg-surface-container-highest text-on-surface-variant hover:text-white text-xs font-semibold transition-all">
                            Cancel
                        </a>
                        <button type="submit"
                                class="px-7 py-2.5 rounded-full bg-primary-container hover:bg-[#1ed760] text-[#003914] font-bold text-sm flex items-center gap-2 shadow-[0_0_20px_rgba(29,185,84,0.35)] active:scale-95 transition-all">
                            <span class="material-symbols-outlined text-[20px]">check</span>
                            <span>Save Playlist</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>

    </main>

    <!-- Docked Bottom Navigation Bar -->
    <nav class="fixed bottom-0 w-full z-50 pb-safe bg-surface/90 backdrop-blur-xl border-t border-white/10 shadow-[0_-4px_24px_rgba(0,0,0,0.6)]">
        <div class="h-16 px-4 flex items-center justify-between max-w-md mx-auto">
            <a th:href="@{/}" class="flex-1 flex flex-col items-center justify-center min-w-[44px] min-h-[44px] gap-0.5 text-on-surface-variant hover:text-on-surface transition-colors">
                <span class="material-symbols-outlined text-[22px]">home</span>
                <span class="text-[11px]">Home</span>
            </a>
            <a th:href="@{/playlists}" class="flex-1 flex flex-col items-center justify-center min-w-[44px] min-h-[44px] gap-0.5 text-primary font-bold transition-colors">
                <span class="material-symbols-outlined text-[22px]" style="font-variation-settings: 'FILL' 1;">queue_music</span>
                <span class="text-[11px]">Playlists</span>
            </a>
            <div class="flex-1 flex items-center justify-center">
                <a th:href="@{/song/add}" aria-label="Add Song" class="w-11 h-11 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center shadow-[0_0_20px_rgba(29,185,84,0.45)] hover:scale-105 active:scale-95 transition-transform" title="Add New Song">
                    <span class="material-symbols-outlined text-[26px]">add</span>
                </a>
            </div>
            <a th:href="@{/favorites}" class="flex-1 flex flex-col items-center justify-center min-w-[44px] min-h-[44px] gap-0.5 text-on-surface-variant hover:text-on-surface transition-colors">
                <span class="material-symbols-outlined text-[22px]">favorite</span>
                <span class="text-[11px]">Favorites</span>
            </a>
            <a th:href="@{/analytics}" class="flex-1 flex flex-col items-center justify-center min-w-[44px] min-h-[44px] gap-0.5 text-on-surface-variant hover:text-on-surface transition-colors">
                <span class="material-symbols-outlined text-[22px]">insights</span>
                <span class="text-[11px]">Analytics</span>
            </a>
        </div>
    </nav>

</body>
</html>
