<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Song Details</title>

    <link rel="stylesheet" th:href="@{/style.css}">

</head>

<body>

<div th:replace="~{navbar :: navbar}"></div>

<h1>🎵 Song Details</h1>

<div class="song-details-container">

<img
    th:src="${song.imageUrl}"
    class="details-image"
    alt="Album Cover">

<div class="song-info-card">

    <h2 th:text="${song.title}"></h2>

   <div class="song-info-grid">

    <div class="info-row">
        <span class="info-label">👤 Artist</span>
        <span th:text="${song.artist}"></span>
    </div>

    <div class="info-row">
        <span class="info-label">💿 Album</span>
        <span th:text="${song.album}"></span>
    </div>

    <div class="info-row">
        <span class="info-label">🎼 Genre</span>
        <span th:text="${song.genre}"></span>
    </div>

    <div class="info-row">
        <span class="info-label">🌍 Language</span>
        <span th:text="${song.language}"></span>
    </div>

    <div class="info-row">
        <span class="info-label">⏱ Duration</span>
        <span th:text="${song.duration}"></span>
    </div>

    <div class="info-row">
        <span class="info-label">📅 Release Year</span>
        <span th:text="${song.releaseYear}"></span>
    </div>

    <div class="info-row">
        <span class="info-label">⭐ Rating</span>
        <span>
            <span th:text="${song.rating}"></span>/5
        </span>
    </div>

</div>
<p th:if="${song.favorite}">
    <strong>Status:</strong> ❤️ Favorite
</p>

<p th:unless="${song.favorite}">
    <strong>Status:</strong> 🤍 Not Favorite
</p>
<h3 class="section-title">📝 Lyrics</h3>

<div class="lyrics-box">

    <p th:text="${song.lyrics}"
       class="lyrics-text">
    </p>

</div>
<div class="action-buttons">

    <a th:if="${song.youtubeUrl != null and !#strings.isEmpty(song.youtubeUrl)}"
       th:href="${song.youtubeUrl}"
       target="_blank">
        <button class="youtube-btn">▶ Watch on YouTube</button>
    </a>

    <a th:if="${song.spotifyUrl != null and !#strings.isEmpty(song.spotifyUrl)}"
       th:href="${song.spotifyUrl}"
       target="_blank">
        <button class="spotify-btn">🎵 Listen on Spotify</button>
    </a>

    <a href="/">
        <button class="back-btn">⬅ Back to Home</button>
    </a>

</div>

</div>

</div>

</div>

</body>

</html>
